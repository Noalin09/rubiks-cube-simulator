<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rubik's Mobile Pro - 觸控手勢版</title>
    <style>
        :root { --primary: #00f2ff; --bg: #020617; --panel: rgba(15, 23, 42, 0.9); }
        body { margin: 0; overflow: hidden; background: var(--bg); color: #fff; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }

        /* UI 佈局 */
        #app-ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .panel { pointer-events: auto; background: var(--panel); backdrop-filter: blur(10px); border-radius: 12px; padding: 12px; border: 1px solid rgba(0, 242, 255, 0.2); }
        
        /* 頂部資訊 */
        .header { display: flex; justify-content: space-between; align-items: center; }
        .timer { font-size: 24px; font-weight: bold; color: var(--primary); font-family: monospace; }

        /* 側邊控制欄 */
        .controls { width: 140px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        h4 { margin: 0; font-size: 10px; color: #64748b; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        
        button { background: #1e293b; border: 1px solid #334155; color: #fff; padding: 10px 5px; border-radius: 6px; cursor: pointer; font-size: 11px; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        button:active { background: var(--primary); color: #000; }
        button.active { background: var(--primary); color: #000; }
        .action-btn { background: var(--primary); color: #000; font-weight: bold; border: none; }

        /* 底部提示 */
        .footer { text-align: center; font-size: 11px; color: rgba(255,255,255,0.5); }

        /* 說明書 */
        #manual { position: absolute; top: 0; left: -100%; width: 80%; height: 100%; background: var(--panel); z-index: 1000; transition: 0.4s; padding: 30px; box-sizing: border-box; pointer-events: auto; border-right: 1px solid var(--primary); }
        #manual.open { left: 0; }
    </style>
</head>
<body>

<div id="app-ui">
    <div class="header">
        <div class="panel">
            <div class="timer" id="timer">00:00.0</div>
        </div>
        <button class="panel" style="padding: 10px 20px;" onclick="toggleManual()">?</button>
    </div>

    <div class="controls panel">
        <h4>階數</h4>
        <div class="grid">
            <button class="ord-btn" data-val="2">2x2</button>
            <button class="ord-btn active" data-val="3">3x3</button>
            <button class="ord-btn" data-val="4">4x4</button>
            <button class="ord-btn" data-val="5">5x5</button>
        </div>
        <h4>模式</h4>
        <div class="grid">
            <button class="type-btn active" data-type="cube">經典</button>
            <button class="type-btn" data-type="mirror">鏡面</button>
        </div>
        <button id="scramble" class="action-btn">自動打亂</button>
        <button id="undo" style="width:100%">悔步 (Undo)</button>
    </div>

    <div class="footer">
        滑動方塊表面來轉動層級 | 點擊空白處旋轉視角
    </div>
</div>

<div id="manual">
    <h2 style="color: var(--primary);">操作說明 (Manual)</h2>
    <ul>
        <li><b>手機操作：</b>直接在方塊表面「滑動」即可撥動該層。在背景滑動可旋轉視角。</li>
        <li><b>鏡面模式：</b>方塊形狀會隨旋轉改變，極具挑戰性。</li>
        <li><b>自動校準：</b>引擎會在旋轉結束後自動對齊網格，防止誤差。</li>
    </ul>
    <button onclick="toggleManual()" style="width:100%; margin-top:20px;">關閉</button>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.2/index.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import gsap from 'gsap';

    let scene, camera, renderer, controls, cubeGroup;
    let order = 3, type = 'cube';
    let isAnimating = false, history = [];
    let startTime, timerInt, isTimerRunning = false;

    // 觸控互動相關變數
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDraggingLayer = false;
    let dragStartPos = new THREE.Vector2();
    let intersectCubie = null;
    let intersectNormal = null;

    init();
    render();

    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);

        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(order*2, order*2, order*3);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 兼顧效能
        document.body.appendChild(renderer.domElement);

        controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.rotateSpeed = 0.8;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const light = new THREE.DirectionalLight(0xffffff, 1.0);
        light.position.set(10, 20, 10);
        scene.add(light);

        buildCube();
        setupInput();
    }

    function buildCube() {
        if (cubeGroup) scene.remove(cubeGroup);
        cubeGroup = new THREE.Group();
        const offset = (order - 1) / 2;
        const colors = [0x00ff00, 0x0000ff, 0xffff00, 0xffffff, 0xff0000, 0xffa500];

        for (let x=0; x<order; x++) {
            for (let y=0; y<order; y++) {
                for (let z=0; z<order; z++) {
                    const geom = (type === 'mirror') ? 
                        new THREE.BoxGeometry(0.5+x*0.3, 0.5+y*0.3, 0.5+z*0.3) :
                        new THREE.BoxGeometry(0.96, 0.96, 0.96);

                    const mats = colors.map((c, i) => {
                        let isFace = false;
                        if(i===0 && x===order-1) isFace = true;
                        if(i===1 && x===0) isFace = true;
                        if(i===2 && y===order-1) isFace = true;
                        if(i===3 && y===0) isFace = true;
                        if(i===4 && z===order-1) isFace = true;
                        if(i===5 && z===0) isFace = true;
                        return new THREE.MeshStandardMaterial({ color: isFace ? c : 0x111111, roughness: 0.1 });
                    });

                    const cubie = new THREE.Mesh(geom, mats);
                    cubie.position.set(x-offset, y-offset, z-offset);
                    cubeGroup.add(cubie);
                }
            }
        }
        scene.add(cubeGroup);
    }

    // --- 核心互動邏輯：手機觸控轉動 ---
    function setupInput() {
        const onDown = (e) => {
            if (isAnimating) return;
            const x = e.touches ? e.touches[0].clientX
